---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-media
  namespace: immich
spec:
  accessModes:
    - ReadWriteMany
  volumeMode: Filesystem
  storageClassName: immich-media-storage
  volumeName: immich-media-pv
  resources:
    requests:
      storage: 2Ti
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-backups
  namespace: immich
spec:
  accessModes:
    - ReadWriteMany
  volumeMode: Filesystem
  storageClassName: immich-backup-storage
  volumeName: immich-backup-pv
  resources:
    requests:
      storage: 2Ti
