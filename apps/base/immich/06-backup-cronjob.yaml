---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-backup
  namespace: immich
spec:
  schedule: "0 3 * * *"
  timeZone: Europe/Stockholm
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 86400
      template:
        metadata:
          labels:
            app: immich-backup
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
                - |
                  TS="$(date +%Y-%m-%d_%H-%M-%S)"
                  DEST="/backups/immich-${TS}"
                  mkdir -p "$DEST"

                  echo "Creating database dump..."
                  pg_dump \
                    --host="$PGHOST" \
                    --port=5432 \
                    --username="$PGUSER" \
                    --dbname="$PGDATABASE" \
                    --format=custom \
                    --file="$DEST/database.dump"

                  echo "Archiving media..."
                  tar -czf "$DEST/media.tar.gz" -C /data .

                  date -u +"%Y-%m-%dT%H:%M:%SZ" > "$DEST/COMPLETED"

                  echo "Removing completed backups older than 30 days..."
                  find /backups \
                    -mindepth 1 -maxdepth 1 \
                    -type d -name 'immich-*' -mtime +30 \
                    -exec sh -c '
                      for d do
                        if [ -f "$d/COMPLETED" ]; then
                          rm -rf -- "$d"
                        fi
                      done
                    ' sh {} +

                  echo "Backup completed: $DEST"
              env:
                - name: PGHOST
                  value: immich-postgres
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: immich-secrets
                      key: DB_USERNAME
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: immich-secrets
                      key: DB_PASSWORD
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: immich-secrets
                      key: DB_DATABASE_NAME
              volumeMounts:
                - name: media
                  mountPath: /data
                  readOnly: true
                - name: backups
                  mountPath: /backups
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  memory: 2Gi
          volumes:
            - name: media
              persistentVolumeClaim:
                claimName: immich-media
            - name: backups
              persistentVolumeClaim:
                claimName: immich-backups
