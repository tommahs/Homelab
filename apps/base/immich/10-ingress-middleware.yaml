---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: immich-security-headers
  namespace: immich
spec:
  headers:
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: no-referrer
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
  namespace: immich
spec:
  redirectScheme:
    scheme: https
    permanent: true
